# PPO Training Configuration for StardewFishSim-v0
ppo:
  n_envs: 16                  # Parallel environments (SubprocVecEnv)
  n_steps: 512                # Steps per rollout per env -> buffer = 8,192
  batch_size: 512             # Minibatch size
  epochs: 10                  # Optimization epochs per iteration
  learning_rate: 3.0e-4       # Linear decay to 0
  clip_range: 0.2
  gae_lambda: 0.95
  gamma: 0.999                # Effective horizon ~33s @ 30Hz
  ent_coef_start: 0.01        # Entropy annealing
  ent_coef_end: 0.001
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_arch: [64, 64]       # Two hidden layers with tanh activations
  total_timesteps: 15000000   # Pre-training budget (~15M steps)

curriculum:
  stage_a_steps: 2000000      # Easy (d <= 35, large bar)
  stage_b_steps: 5000000      # Mid (d <= 70, nominal DR)
  stage_c_steps: 8000000      # Full DR (d <= 110)

eval:
  eval_freq: 250000           # Evaluation frequency in steps
  n_eval_episodes: 60         # Episodes per evaluation run
  nominal_difficulties: [5, 20, 40, 60, 80, 110]
