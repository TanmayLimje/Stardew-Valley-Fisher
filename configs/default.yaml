game:
  window_title: "Stardew Valley"
  resolution: [1920, 1080]
  ui_zoom: 100

capture:
  driver: bettercam          # bettercam | mss | mock
  monitor_auto: true         # auto-detect display containing window_title
  monitor_idx: null          # manual fallback/override index (0, 1, 2...)
  dynamic_roi: true          # dynamic widget localization across full Screen 3
  roi:
    x0: 720
    y0: 150
    x1: 910
    y1: 800
  track_bounds:
    x0: 76
    y0: 47
    x1: 112
    y1: 615
    height_px: 568
  target_fps: 60


ui:
  dashboard_enabled: true    # Rich terminal telemetry console
  refresh_hz: 4              # UI redraw rate
  target_display: laptop     # target layout sizing (laptop 1536x864 / standard)

control:
  hz: 30                     # 30 => 2 ticks @ 60Hz; 20 => 3 ticks
  action_set: discrete2      # discrete2 | discrete3_tap
  timer_period_ms: 1         # timeBeginPeriod resolution

reward:
  w_o: 0.02
  w_p: 5.0
  w_v: 0.002
  w_s: 0.005
  r_win: 10.0
  r_lose: 5.0
  gamma: 0.999
  t_max_s: 30

ppo:
  n_envs: 32
  n_steps: 512
  batch_size: 512
  epochs: 10
  learning_rate: 3.0e-4
  clip_range: 0.2
  gae_lambda: 0.95
  ent_coef_start: 0.01
  ent_coef_end: 0.001
  policy_arch: [64, 64]
  total_timesteps: 3.0e7

sim:
  seed_params:
    g_out: 1.58
    g_in: 0.95
    damp: 1.0
    e_bot: 0.667
    e_top: 0.667
    p0: 0.30
  randomization: true
  curriculum: ["A", "B", "C"]

assistant:
  idle_scan_hz: 10             # Frame scan rate while watching for minigame (low CPU)
  detection_confirm_frames: 2  # Consecutive detections before activating PPO
  transition_delay_ms: 200     # Pause before taking control (lets UI settle)
  show_notifications: true     # Rich console status updates

lifecycle:
  food_hotbar_slot: 1        # hotbar key for food consumption (e.g. '1' for salad/cheese)
  stamina_threshold_pct: 15  # consume food when stamina drops below 15%
  night_cutoff_hour: 25.5    # 1:30 AM in game decimal time (24.0 + 1.5)

safety:
  killswitch_key: f9
  hard_abort: ctrl+f9
  max_episodes: 100
  max_session_min: 45
  ui_lost_timeout_ms: 500
  tracker_lost_frames: 15
  capture_fps_floor: 45

waterer:
  tile_size_px: 64                # Tile grid size at 100% UI zoom 1080p
  player_center: [960, 540]       # Player center on screen (camera-locked)
  water_capacity: 40              # Watering can uses (basic=40, copper=55, steel=70, gold=85, iridium=100)
  tile_walk_ms: 250               # WASD key hold per tile movement
  watering_click_ms: 150          # LMB hold for watering action
  refill_click_ms: 500            # LMB hold for refilling at pond
  refill_anim_ms: 1000            # Refill animation lock before resuming watering
  watering_anim_ms: 450           # Watering animation lock; movement blocked until elapsed
  cursor_aim: true                # Aim tool by parking OS cursor on target tile (fallback false: WASD facing taps)
  grid_phase: auto                # auto = recover sub-tile grid offset per scan; or [dx, dy] px
  map_edge_margin_tiles: 15       # Sanity guard: skip targets farther than N tiles (covers visible frame)
  max_scan_passes: 3              # Re-scan passes before declaring done
  scan_settle_ms: 500             # Wait after all movement before scanning
  pond_direction: "right"         # Cardinal direction to walk for refill
  pond_max_tiles: 15              # Max tiles to walk toward pond before abort
  path_strategy: "auto"           # auto | serpentine | greedy
  detection_thresholds:
    dry_soil_pct: 30              # % of tile pixels matching dry soil HSV
    watered_soil_pct: 25          # % matching watered soil HSV
    crop_sprite_pct: 10           # % matching green crop HSV
    water_body_pct: 40            # % matching blue water HSV

