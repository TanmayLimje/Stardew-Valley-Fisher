[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fisher"
version = "0.1.0"
description = "Autonomous RL Agent for the Stardew Valley Fishing Minigame"
readme = "plan.md"
requires-python = ">=3.11"
authors = [
    { name = "Fisher Project Team" }
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "numpy>=1.24.0",
    "pywin32>=306; sys_platform == 'win32'",
    "pydirectinput>=1.0.4; sys_platform == 'win32'",
    "bettercam>=0.2.1; sys_platform == 'win32'",
    "opencv-python>=4.8.0",
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.3.0",
    "torch>=2.0.0",
    "keyboard>=0.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
fisher = "fisher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
